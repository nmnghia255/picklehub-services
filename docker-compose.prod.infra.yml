services:
  postgres-subscription:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SUBSCRIPTION_DB_USER}
      - POSTGRES_PASSWORD=${SUBSCRIPTION_DB_PASSWORD}
      - POSTGRES_DB=${SUBSCRIPTION_DB_NAME}
    volumes:
      - postgres-subscription-data:/var/lib/postgresql/data
    networks:
      - picklehub-network
    restart: always
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SUBSCRIPTION_DB_USER} -d ${SUBSCRIPTION_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

