    }

    upstream user_service {
        server user-service:8006;
    }

    upstream sport_center_service {
        server sport-center-service:8007;
    }

    upstream friend_service {
        server friend-service:8010;
    }

    upstream media_service {
        server media-service:8011;
    }
    upstream tournament_service {
        server tournament-service:8008;
    }


    upstream subscription_service {
        server subscription-service:8012;
    }

    upstream coach_service {
        server coach-service:8019;
    }

    upstream chat_service {
